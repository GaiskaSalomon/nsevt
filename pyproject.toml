[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nsevt"
version = "0.3.4"
description = "Peaks-over-threshold GPD tail inference with continuous and interval-censored (grouped) fits, profile-likelihood intervals for shape and endpoint, permutation trend tests, power/MDE, and multi-source robustness."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elí Gaiska Salomón-Guzmán", email = "salomon.eli@colpos.mx" }]
maintainers = [{ name = "Elí Gaiska Salomón-Guzmán", email = "salomon.eli@colpos.mx" }]
keywords = ["extreme value theory", "generalized Pareto", "non-stationarity",
            "permutation test", "power analysis", "climate extremes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.22", "scipy>=1.7"]

[project.optional-dependencies]
demo = ["streamlit>=1.30", "pandas>=1.3", "matplotlib>=3.5"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
dev = ["build>=1.0", "twine>=5.0", "pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.12"]

[project.urls]
Homepage = "https://github.com/GaiskaSalomon/nsevt"
Repository = "https://github.com/GaiskaSalomon/nsevt"
Issues = "https://github.com/GaiskaSalomon/nsevt/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nsevt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP035", "UP045"]
