name: Prepare GitHub release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python tools/release_check.py --tag "${GITHUB_REF_NAME}"
      - run: ruff check src tests demo tools
      - run: mypy src/nsevt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: pytest -q --cov=nsevt --cov-report=term --cov-fail-under=80

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python tools/release_check.py --tag "${GITHUB_REF_NAME}"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/write_checksums.py dist
      - run: python tools/check_distributions.py dist
      - name: Smoke-install wheel
        run: |
          python -m venv /tmp/nsevt-release
          /tmp/nsevt-release/bin/pip install dist/*.whl
          /tmp/nsevt-release/bin/python tests/smoke_release.py
      - name: Smoke-install source distribution
        run: |
          python -m venv /tmp/nsevt-release-sdist
          /tmp/nsevt-release-sdist/bin/pip install dist/*.tar.gz
          /tmp/nsevt-release-sdist/bin/python tests/smoke_release.py
      - name: Create the reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --draft --verify-tag --target "${GITHUB_SHA}"
          --title "nsevt ${GITHUB_REF_NAME#v}" --generate-notes
