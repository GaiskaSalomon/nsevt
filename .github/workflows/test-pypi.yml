name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python tools/release_check.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/write_checksums.py dist
      - run: python tools/check_distributions.py dist
      - name: Smoke-install wheel
        run: |
          python -m venv /tmp/nsevt-testpypi
          /tmp/nsevt-testpypi/bin/pip install dist/*.whl
          /tmp/nsevt-testpypi/bin/python tests/smoke_release.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: testpypi-python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/nsevt/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testpypi-python-package-distributions
          path: release-assets/
      - name: Select distribution files only
        run: |
          mkdir -p dist
          cp release-assets/*.whl release-assets/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
