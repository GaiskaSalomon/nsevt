name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python tools/release_check.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/write_checksums.py dist
      - run: python tools/check_distributions.py dist
      - name: Smoke-install wheel
        run: |
          python -m venv /tmp/nsevt-testpypi
          /tmp/nsevt-testpypi/bin/pip install dist/*.whl
          /tmp/nsevt-testpypi/bin/python tests/smoke_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: testpypi-python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/nsevt/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testpypi-python-package-distributions
          path: release-assets/
      - name: Select distribution files only
        run: |
          mkdir -p dist
          cp release-assets/*.whl release-assets/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
