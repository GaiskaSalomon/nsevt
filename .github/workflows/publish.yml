name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-install wheel
        run: |
          python -m venv /tmp/nsevt-release
          /tmp/nsevt-release/bin/pip install dist/*.whl
          /tmp/nsevt-release/bin/python tests/smoke_release.py
      - name: Smoke-install source distribution
        run: |
          python -m venv /tmp/nsevt-release-sdist
          /tmp/nsevt-release-sdist/bin/pip install dist/*.tar.gz
          /tmp/nsevt-release-sdist/bin/python tests/smoke_release.py
      - name: Verify release tag and package version
        run: |
          test "${GITHUB_REF_NAME}" = "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nsevt/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
