name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Download the immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --pattern '*.whl' --dir dist
          gh release download "${GITHUB_REF_NAME}" --pattern '*.tar.gz' --dir dist
          gh release download "${GITHUB_REF_NAME}" --pattern 'SHA256SUMS' --dir .
      - name: Verify source, tag, artifacts, and hashes
        run: |
          python tools/release_check.py --tag "${GITHUB_REF_NAME}"
          python tools/check_distributions.py dist --checksums SHA256SUMS
      - run: python -m pip install --upgrade twine
      - run: python -m twine check dist/*
      - name: Smoke-install wheel
        run: |
          python -m venv /tmp/nsevt-release
          /tmp/nsevt-release/bin/pip install dist/*.whl
          /tmp/nsevt-release/bin/python tests/smoke_release.py
      - name: Smoke-install source distribution
        run: |
          python -m venv /tmp/nsevt-release-sdist
          /tmp/nsevt-release-sdist/bin/pip install dist/*.tar.gz
          /tmp/nsevt-release-sdist/bin/python tests/smoke_release.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: verified-python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nsevt/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
